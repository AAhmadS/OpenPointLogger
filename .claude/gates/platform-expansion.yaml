notes: >
  Statuses in use here: `pass` = the owner decided it; `n/a` = it does not apply, with a
  reason; `unmeasured` = not established, which blocks nothing and is never a failure;
  `blocked` = measured, and the measurement is bad news. An owner answer of "we will decide
  this before shipping" produces `unmeasured` with `deferred_to: pre-ship`, never `pass` -
  filling a required field with a plausible answer nobody gave is the exact failure mode
  ~/.claude/rules/evidence-resolvers.md exists to prevent.
