  - id: telegram-network-reachability
    name: api.telegram.org unreachable from the owner's network
    status: blocked
    kind: human
    owner: owner
    evidence: >
      MEASURED 2026-09-22 on the owner's machine, literal output:
        token source: env | length: 46 | value: NEVER PRINTED
        getMe FAILED (transport): URLError <urlopen error _ssl.c:983: The handshake
          operation timed out>
        DNS resolves -> ['10.10.34.36']
        TCP connect 10.10.34.36:443 FAILED after 5.21s: ConnectionRefusedError
          [WinError 10061] No connection could be made because the target machine
          actively refused it
        CONTROL openrouter.ai:443 TLS OK in 0.39s -> TLSv1.3
      api.telegram.org resolves to a private RFC1918 address (10.10.34.36) that refuses
      the connection, while a control host on the same machine completes TLS in 0.39s.
      That is DNS-level interception, not a fault in telegram_bridge.py.
      The token itself was NEVER validated - the request never reached Telegram - so
      whether the .env token is accepted by Telegram is NOT ESTABLISHED.
    question: >
      Telegram is one of the three V1 focus platforms but is unreachable from this network.
      Should telegram_bridge.py grow proxy support (HTTP/SOCKS5, configured in Settings),
      or will the bridge only ever run behind a system-wide VPN?
    recommended: >
      Add proxy support to telegram_bridge.py. It is a small change - the module makes every
      call through one UrllibTransport class using stdlib urllib, so a ProxyHandler opener
      built from a Settings field covers all of it - and it makes the feature testable on
      the owner's own machine, which a system VPN does not guarantee.
    blocks: [T15, T16]
    note: >
      Added 2026-09-22 by the main session after the owner authorised a live getMe check
      (answer 15). The bridge code is complete and unit-tested; it has never once exchanged
      a packet with Telegram.

