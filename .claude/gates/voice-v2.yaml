  0  pass=68 fail=0  tests/test_persian.py
  0  pass=134 fail=0  tests/test_persian_export.py
  0  pass=25 fail=0  tests/test_science.py
  0  pass=34 fail=0  tests/test_speaker.py
  0  ok-lines=12  tests/test_store.py
  0  pass=47 fail=0  tests/test_telegram.py
  0  pass=269 fail=0  tests/test_voice_session.py
