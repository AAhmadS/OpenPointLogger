<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-labelledby="title">
<title id="title">Trailmark — citation-ledger mark</title>
<defs>
  <!-- warm amber diagonal 135deg, matches #f0a94a → #c97f2d -->
  <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#f0a94a"/>
    <stop offset="100%" stop-color="#c97f2d"/>
  </linearGradient>
</defs>
<!-- Backgroundless — no tile, transparent. All shapes use solid amber, flat, no stroke. -->
<!-- Top citation bar: W48% H9.5% y24% centered -->
<rect x="26" y="24" width="48" height="9.5" rx="3.2" ry="3.2" fill="url(#amber)"/>
<!-- Vertical spine: W10% H36% y34.5% centered -->
<rect x="45" y="34.5" width="10" height="36" rx="2" ry="2" fill="url(#amber)"/>
<!-- Ledger ticks — pill ends (rx = H/2), flush to spine, no gap -->
<rect x="55" y="38" width="18" height="7" rx="3.5" ry="3.5" fill="url(#amber)"/>
<rect x="27" y="49.5" width="18" height="7" rx="3.5" ry="3.5" fill="url(#amber)"/>
<rect x="55" y="61" width="18" height="7" rx="3.5" ry="3.5" fill="url(#amber)"/>
</svg>