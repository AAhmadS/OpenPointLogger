<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
<title id="title">Trailmark tile</title>
<defs>
  <linearGradient id="amberTile" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#f0a94a"/>
    <stop offset="100%" stop-color="#c97f2d"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
    <stop offset="35%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
</defs>
<!-- Tile background: dark navy rounded-square r22% -->
<rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#0b0f16"/>
<rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#gloss)"/>
<!-- Mark: same geometry as backgroundless, amber -->
<rect x="26" y="24" width="48" height="9.5" rx="3.2" ry="3.2" fill="url(#amberTile)"/>
<rect x="45" y="34.5" width="10" height="36" rx="2" ry="2" fill="url(#amberTile)"/>
<rect x="55" y="38" width="18" height="7" rx="3.5" ry="3.5" fill="url(#amberTile)"/>
<rect x="27" y="49.5" width="18" height="7" rx="3.5" ry="3.5" fill="url(#amberTile)"/>
<rect x="55" y="61" width="18" height="7" rx="3.5" ry="3.5" fill="url(#amberTile)"/>
</svg>